<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121c2b">
<title>MiPellets · Control de pellet</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
/* ===== GENERAL ===== */
body{
  margin:0;
  font-family:system-ui, Arial;
  background:#121212;
  color:#f0f0f0;
  overflow-x:hidden;
  --page-bg:#121212;
  --header-bg:#1f2937;
  --card-bg:#1e1e1e;
  --input-bg:#2c2c2c;
  --text-color:#f0f0f0;
  --muted-color:#9ca3af;
  --border-color:#333;
  --hover-bg:#2c2c2c;
  --metric-bg:#252525;
  --shadow-color:rgba(0,0,0,.35);
}
body.light-mode{
  background:#f3f4f6;
  color:#1f2937;
  --page-bg:#f3f4f6;
  --header-bg:#ffffff;
  --card-bg:#ffffff;
  --input-bg:#e5e7eb;
  --text-color:#1f2937;
  --muted-color:#6b7280;
  --border-color:#d1d5db;
  --hover-bg:#e5e7eb;
  --metric-bg:#f9fafb;
  --shadow-color:rgba(0,0,0,.10);
}

header{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 50px;
  background:var(--header-bg);
  color:var(--text-color);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  z-index: 1000;
  box-sizing: border-box;
}

nav{
  position: fixed;
  top: 50px;
  left: 0;
  width: 100%;
  height: 50px;
  display: flex;
  background: #1f2937;
  border-bottom: 1px solid var(--border-color);
  z-index: 999;
}

nav button{
  flex:1;
  border:none;
  background:none;
  color:var(--muted-color);
  font-size:0.75rem;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  transition: background 0.2s;
}

nav button.active{
  color:#60a5fa;
}

nav button span{
  font-size:0.7rem;
}

nav button:hover{
  background:#111827;
}

#content{
  padding:12px;
  padding-top:110px;
  overflow-y:auto;
}

.card{
  background:var(--card-bg);
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 6px var(--shadow-color);
}
input, button{
  width:100%;
  padding:12px;
  margin-bottom:8px;
  border-radius:8px;
  border:none;
  background:var(--input-bg);
  color:var(--text-color);
  font-size:1rem;
}
button.primary{
  background:#2563eb;
  color:var(--text-color);
  font-weight:600;
}


/* Inicio y recogidas */
#homeSummary p { margin:10px 0; display:flex; justify-content:space-between; gap:12px; }
#homeSummary strong { text-align:right; }
.fab-pickup { position:fixed; right:18px; left:auto; bottom:18px; z-index:1200; width:58px; height:58px; border-radius:50%; padding:0; margin:0; font-size:2rem; box-shadow:0 5px 18px rgba(0,0,0,.45); }
#pickupPanel { position:fixed; left:auto; right:14px; bottom:88px; z-index:1199; max-width:520px; background:var(--card-bg); border:1px solid var(--border-color); border-radius:14px; padding:16px; box-shadow:0 8px 28px var(--shadow-color); display:none; }
#pickupPanel.show { display:block; }
#pickupPanel .pickup-fields { display:flex; gap:8px; align-items:center; }
#pickupPanel input { min-width:0; }
@media(min-width:700px){ #pickupPanel { left:auto; right:18px; width:420px; } }
.metric { background:var(--metric-bg); border-radius:10px; padding:12px; margin:8px 0; }
.metric small { display:block; color:var(--muted-color); margin-bottom:5px; }
.metric strong { font-size:1.25rem; }
nav button span { font-size:.7rem; }

/* ===== CALENDARIO Y GRÁFICA ===== */
#calendar{
  width:100%;
  max-width:100%;
  margin:auto;
  background:var(--card-bg);
  border-radius:12px;
  padding:6px;
}
canvas{
  width:100% !important;
  max-width:100% !important;
  height:auto !important;
}

/* ===== EVENTOS ===== */
.green-event{ background:#4ade80!important; color:#000!important; }
.yellow-event{ background:#facc15!important; color:#000!important; }
.pickup-event{ background:#60a5fa!important; color:#000!important; }

/* Círculos de estado en el número del día */
.fc .day-circle .fc-daygrid-day-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  margin: 3px;
  padding: 0;
  border-radius: 50%;
  box-sizing: border-box;
  text-decoration: none;
}
.fc .day-circle-green .fc-daygrid-day-number {
  background: #22c55e !important;
  color: #052e16 !important;
}
.fc .day-circle-brown .fc-daygrid-day-number {
  background: #8b5a2b !important;
  color: #ffffff !important;
}
.fc .day-circle-red .fc-daygrid-day-number {
  background: #ef4444 !important;
  color: #ffffff !important;
  font-weight: 800 !important;
}

/* ===== HEADER TEMPORADA ICONOS PEGADOS ===== */
.season-box {
  max-width: 250px;
}
.season-box select {
  width: 100%;
  padding:10px;
  border-radius:8px;
  border:none;
  background:var(--input-bg);
  color:var(--text-color);
  font-size:1rem;
  cursor:pointer;
}

/* ===== DATOS GENERALES Y NUEVA RECOGIDA ===== */
.card-dual {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}
.card-dual .card {
  flex: 1 1 48%;
  min-width: 220px;
}
@media(max-width:600px){
  .card-dual {
    flex-direction: column;
    gap: 12px;
  }
  .card-dual .card {
    flex: 1 1 100%;
  }
}

/* ===== MENU HAMBURGUESA ===== */
.menu-btn { width:auto; }
.menu-dropdown {
  position: absolute;
  top: 50px;
  right: 0;
  background: #1e1e1e;
  border-radius: 10px;
  min-width: 160px;
  padding: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.5);
  display: none;
  z-index: 2000;
}
.menu-dropdown.show { display:block; }
.menu-dropdown div { padding:12px; cursor:pointer; border-bottom:1px solid var(--border-color); }
.menu-dropdown div:last-child { border-bottom:none; }
.menu-dropdown div:hover{ background:var(--input-bg); }

.menu-item{ padding:10px; cursor:pointer; border-radius:6px; }
.menu-item:hover{ background:var(--input-bg); }

.submenu{ display:none; margin-left:10px; margin-top:6px; border-left:2px solid #2563eb; padding-left:8px; }
.submenu.show{ display:block; }
.submenu div{ padding:8px; border-radius:6px; cursor:pointer; }
.submenu div:hover{ background:var(--input-bg); }
.submenu-action{ font-weight:600; }
.submenu-action.danger{ color:#ef4444; }

/* ===== DATOS COMPACTOS ===== */
.card-datos, .card-recogida, .card-casa {
  display: flex;
  align-items: center;
  gap:8px;
  max-width:350px;
  margin-bottom:12px;
}
.card-datos input, .card-recogida input, .card-casa input {
  flex:1; margin-bottom:0; text-align:center;
}
.card-datos button, .card-recogida button, .card-casa button { width:48px; height:48px; padding:0; font-size:1.2rem; }

/* Días de lunes a viernes: blanco y texto negro */
.fc .weekday{ background-color: #ffffff !important; color:#000000 !important; }
/* Fines de semana: gris claro y texto negro */
.fc .weekend-day{ background-color: #d1d5db !important; color:#000000 !important; }
/* Encabezados de días de la semana */
.fc .fc-col-header-cell-cushion{ color:#000000 !important; font-weight:600; }
/* Números de semana */
.fc .fc-week-number{ background-color:#f3f4f6 !important; color:#000000; font-weight:600; }
/* Día actual */
.fc .fc-day-today{ border-radius:4px; font-weight:600; }


/* ===== GASTOS ANUALES ===== */
#gastosSection .expense-total { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#gastosSection .expense-total .metric { margin:0; }
#gastosSection .expense-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-color); }
#gastosSection .expense-row:last-child { border-bottom:0; }
#gastosSection .expense-row small { display:block; color:var(--muted-color); margin-top:3px; }
#gastosSection .expense-row button { width:auto; margin:0; padding:8px 10px; }
#gastosSection .pie-wrap { position:relative; width:100%; max-width:460px; height:340px; margin:auto; }
@media(max-width:420px){ #gastosSection .expense-total { grid-template-columns:1fr; } #gastosSection .pie-wrap { height:300px; } }
/* ===== TEMA CLARO ===== */
body.light-mode header,
body.light-mode nav { background:var(--header-bg); color:var(--text-color); }
body.light-mode nav button { color:#6b7280; }
body.light-mode nav button.active { color:#2563eb; }
body.light-mode nav button:hover,
body.light-mode .menu-item:hover,
body.light-mode .menu-dropdown div:hover,
body.light-mode .submenu div:hover { background:var(--hover-bg); }
body.light-mode .menu-dropdown { border:1px solid var(--border-color); box-shadow:0 6px 20px var(--shadow-color); }
body.light-mode .menu-dropdown div,
body.light-mode .submenu { border-color:var(--border-color); }
body.light-mode #calendar { background:var(--card-bg); }
body.light-mode #calendar .fc .fc-toolbar-title { color:#1f2937; }
body.light-mode #calendar .fc .fc-button { background:#e5e7eb; border-color:#d1d5db; color:#1f2937; }
body.light-mode #calendar .fc .fc-button-primary:not(:disabled).fc-button-active,
body.light-mode #calendar .fc .fc-button-primary:focus { background:#2563eb; border-color:#2563eb; color:#fff; }
body.light-mode .fc .fc-daygrid-day { background:#fff; }
body.light-mode .fc .fc-daygrid-day-frame { background:#fff; }
body.light-mode .fc .fc-scrollgrid,
body.light-mode .fc td,
body.light-mode .fc th { border-color:#d1d5db; }
body.light-mode .fc .fc-col-header-cell { background:#e5e7eb; }
body.light-mode .fc .fc-col-header-cell-cushion { color:#1f2937 !important; }
body.light-mode canvas { filter:none; }
body.light-mode #pickupPanel { background:#fff; }
body.light-mode .metric { background:#f9fafb; }
body.light-mode input,
body.light-mode button:not(.primary),
body.light-mode .season-box select { color:#1f2937; }
body.light-mode input::placeholder { color:#6b7280; }

/* ===== CALENDARIO ADAPTABLE A MÓVIL ===== */
#calendar .fc .fc-header-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 4px 4px 14px;
}
#calendar .fc .fc-toolbar-chunk {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
#calendar .fc .fc-toolbar-title {
  color: #f3f4f6;
  font-size: 1.25rem;
  line-height: 1.25;
  white-space: normal;
}
#calendar .fc .fc-button {
  width: auto;
  min-height: 38px;
  margin: 0;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: .9rem;
}
#calendar .fc .fc-button-group {
  display: inline-flex;
  gap: 5px;
}
@media (max-width: 520px) {
  #calendar { padding: 8px 5px; }
  #calendar .fc .fc-header-toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px 8px;
    margin: 2px 2px 12px;
  }
  /* El título del mes y año ocupa una fila completa. */
  #calendar .fc .fc-toolbar-chunk:nth-child(2) {
    grid-column: 1 / -1;
    grid-row: 1;
    justify-content: center;
    text-align: center;
  }
  #calendar .fc .fc-toolbar-chunk:nth-child(1) {
    grid-column: 1;
    grid-row: 2;
    justify-content: flex-start;
  }
  #calendar .fc .fc-toolbar-chunk:nth-child(3) {
    grid-column: 2;
    grid-row: 2;
    justify-content: flex-end;
  }
  #calendar .fc .fc-toolbar-title {
    font-size: 1.2rem;
    text-align: center;
  }
  #calendar .fc .fc-button {
    min-height: 40px;
    padding: 8px 10px;
    font-size: .85rem;
  }
  #calendar .fc .fc-col-header-cell-cushion {
    font-size: .78rem;
    padding: 5px 1px;
  }
  #calendar .fc .fc-daygrid-day-number {
    font-size: .8rem;
  }
}
/* Botón general del área de clientes de Repsol */
.repsol-link{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;margin-top:14px;padding:12px 16px;border-radius:12px;background:#fff;color:#202020;text-decoration:none;font-weight:700;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.repsol-link:active{transform:scale(.99)}
.repsol-mark{width:34px;height:34px;flex:0 0 34px}

/* ===== MiPellets: rediseño visual inspirado en la referencia Waylet ===== */
:root { color-scheme: dark; }
* { -webkit-tap-highlight-color: transparent; }
html { min-height:100%; background:var(--page-bg); }
body {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing:.1px;
  background:
    radial-gradient(ellipse at 100% 0%, rgba(37,99,235,.15), transparent 38%),
    var(--page-bg);
  padding-bottom:env(safe-area-inset-bottom);
}
body.light-mode {
  color-scheme:light;
  background:
    radial-gradient(ellipse at 100% 0%, rgba(37,99,235,.09), transparent 38%),
    var(--page-bg);
}
header {
  height:66px;
  padding:0 12px;
  gap:8px;
  background:color-mix(in srgb, var(--header-bg) 91%, #0b1220 9%);
  border-bottom:1px solid var(--border-color);
  box-shadow:0 5px 22px rgba(0,0,0,.13);
  backdrop-filter:blur(18px);
}
header::before {
  content:"🔥 MiPellets";
  display:block;
  flex:0 0 auto;
  color:var(--text-color);
  font-size:1.02rem;
  font-weight:850;
  letter-spacing:-.55px;
  white-space:nowrap;
}
.season-container { flex:1; min-width:0; display:flex; justify-content:flex-end; }
.season-box { min-width:0; max-width:100%; }
.season-box select, #seasonSelect {
  max-width:100%;
  min-width:0;
  min-height:40px;
  padding:9px 28px 9px 10px;
  border:1px solid var(--border-color);
  border-radius:14px;
  background:var(--input-bg);
  color:var(--text-color);
  font-size:.78rem;
  font-weight:750;
  outline:none;
}
.menu-btn {
  flex:0 0 42px;
  width:42px !important;
  min-width:42px;
  min-height:42px;
  padding:8px !important;
  margin:0 !important;
  border-radius:14px !important;
  background:var(--input-bg) !important;
  border:1px solid var(--border-color) !important;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
}
.menu-dropdown {
  top:60px;
  right:10px;
  width:min(290px, calc(100vw - 20px));
  padding:8px;
  border:1px solid var(--border-color);
  border-radius:19px;
  background:var(--card-bg);
  box-shadow:0 18px 45px rgba(0,0,0,.3);
  overflow:hidden;
}
.menu-dropdown div { border-radius:12px; padding:12px 13px; }
nav {
  top:auto;
  bottom:0;
  left:0;
  height:calc(73px + env(safe-area-inset-bottom));
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  box-sizing:border-box;
  background:color-mix(in srgb, var(--header-bg) 94%, #080d17 6%);
  border-top:1px solid var(--border-color);
  border-bottom:0;
  box-shadow:0 -8px 30px rgba(0,0,0,.20);
  backdrop-filter:blur(18px);
  z-index:1500;
}
nav button {
  position:relative;
  flex:1;
  width:auto !important;
  min-width:0;
  margin:0 3px !important;
  padding:7px 3px !important;
  border-radius:16px;
  color:var(--muted-color);
  font-size:1.16rem;
  font-weight:650;
  gap:4px;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
nav button span { font-size:.68rem; letter-spacing:0; }
nav button.active {
  color:#fff;
  background:linear-gradient(135deg,#2563eb,#1684f8);
  box-shadow:0 5px 16px rgba(37,99,235,.30);
}
nav button:hover { background:var(--hover-bg); }
nav button.active:hover { background:linear-gradient(135deg,#2563eb,#1684f8); }
#content {
  padding:14px 13px calc(101px + env(safe-area-inset-bottom));
  padding-top:80px;
  overflow-y:visible;
  max-width:900px;
  margin:0 auto;
  box-sizing:border-box;
}
.card {
  position:relative;
  background:var(--card-bg);
  border:1px solid color-mix(in srgb, var(--border-color) 78%, transparent);
  border-radius:23px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}
.card h2,.card h3,#content h2,#content h3 {
  letter-spacing:-.4px;
  font-weight:800;
}
.card h3 { font-size:1.02rem; }
#homeSummary {
  overflow:hidden;
  border:1px solid rgba(96,165,250,.22);
  background:
    radial-gradient(ellipse at 100% 0%, rgba(37,99,235,.20), transparent 46%),
    var(--card-bg);
}
#homeSummary::after {
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:4px;
  height:100%;
  background:linear-gradient(#ff9b35,#2563eb);
}
#homeSummary h3 {
  font-size:1.12rem;
  margin-bottom:16px;
}
#homeSummary p {
  align-items:center;
  padding:10px 11px;
  margin:7px 0;
  border-radius:13px;
  background:color-mix(in srgb, var(--metric-bg) 88%, transparent);
  border:1px solid color-mix(in srgb, var(--border-color) 70%, transparent);
}
#homeSummary p span { font-size:.86rem; }
#homeSummary p strong {
  color:var(--text-color);
  font-size:1.02rem;
  font-weight:850;
  white-space:nowrap;
}
.metric {
  background:linear-gradient(145deg,var(--metric-bg),color-mix(in srgb, var(--metric-bg) 87%, #2563eb 13%));
  border:1px solid color-mix(in srgb, var(--border-color) 76%, transparent);
  border-radius:17px;
  padding:14px;
  margin:8px 0;
}
.metric small { font-size:.77rem; line-height:1.35; }
.metric strong { font-size:1.3rem; letter-spacing:-.5px; }
#content button:not(nav button):not(.menu-btn) {
  border-radius:13px;
  font-weight:700;
}
#content button.primary {
  background:linear-gradient(135deg,#2563eb,#1684f8);
  color:#fff;
  box-shadow:0 5px 14px rgba(37,99,235,.19);
}
input,select,textarea {
  border-radius:13px !important;
  min-height:44px;
  box-sizing:border-box;
}
input:focus,select:focus,textarea:focus {
  outline:2px solid rgba(59,130,246,.55);
  outline-offset:1px;
}
.card-datos,.card-casa {
  gap:9px;
  align-items:center;
}
.card-datos input,.card-casa input {
  min-width:0;
  border:1px solid var(--border-color);
}
.card-casa button {
  width:48px !important;
  min-width:48px;
  min-height:48px;
  margin:0 !important;
  border-radius:16px !important;
  font-size:1.35rem;
}
.card-casa input {
  text-align:center;
  font-size:1.4rem;
  font-weight:850;
  background:var(--metric-bg);
}
.fab-pickup {
  right:17px !important;
  left:auto !important;
  bottom:calc(88px + env(safe-area-inset-bottom)) !important;
  width:60px !important;
  height:60px !important;
  min-width:60px;
  padding:0 !important;
  margin:0 !important;
  border-radius:21px !important;
  background:linear-gradient(145deg,#ffab45,#f97316) !important;
  color:#fff !important;
  border:0 !important;
  box-shadow:0 10px 25px rgba(249,115,22,.38) !important;
  font-size:2rem !important;
}
#pickupPanel {
  border-radius:21px;
  border:1px solid var(--border-color);
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}
#pickupPanel .pickup-fields { flex-wrap:wrap; }
#pickupPanel .pickup-fields input { flex:1 1 120px; }
.repsol-link {
  min-height:60px;
  border-radius:17px;
  box-shadow:0 5px 16px rgba(0,0,0,.10);
}
.expense-total { gap:10px; }
#calendar {
  padding:7px;
  border:1px solid var(--border-color);
  border-radius:19px;
  overflow:hidden;
}
#calendar .fc .fc-toolbar-title { font-weight:850; letter-spacing:-.4px; }
#calendar .fc .fc-button { border-radius:11px; box-shadow:none; }
#calendar .fc .fc-daygrid-day-frame { min-height:56px; }
#calendar .fc .fc-daygrid-day-number { padding:5px; }
#calendar .fc .fc-col-header-cell-cushion { padding:7px 2px; }
#calendar .fc-theme-standard td,#calendar .fc-theme-standard th { border-color:var(--border-color); }
#calendar .fc .fc-day-today { background:rgba(239,68,68,.08); }
canvas { max-width:100% !important; }

/* Refinamiento de estructura: distribución más próxima a la maqueta de referencia */
.screen-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 2px 18px}
.screen-heading h2{font-size:1.55rem;letter-spacing:-.04em;margin:3px 0 4px;font-weight:800}
.screen-heading p{margin:0;color:var(--muted-color);font-size:.9rem}
.eyebrow{font-size:.68rem;letter-spacing:.15em;font-weight:800;color:#7daeff}
.heading-icon{width:48px;height:48px;flex:0 0 48px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#253d5d,#17283d);font-size:1.35rem;border:1px solid #314b69}
.home-hero{padding:19px!important;overflow:hidden;position:relative}
.hero-title,.section-title{display:flex;align-items:center;gap:12px}
.hero-icon,.section-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:14px;background:#1c3450;font-size:1.15rem}
.hero-title h3,.section-title h3{margin:0!important;font-size:1rem;font-weight:800}
.hero-title small,.section-title p{display:block;color:var(--muted-color);font-size:.78rem;margin:4px 0 0}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 12px}
.summary-item{position:relative;min-width:0;background:rgba(255,255,255,.035);border:1px solid rgba(150,180,220,.1);border-radius:16px;padding:13px 12px;display:flex;flex-direction:column;gap:6px}
.summary-item small{color:var(--muted-color);font-size:.76rem}
.summary-item strong{font-size:1.48rem;letter-spacing:-.04em}
.summary-symbol{font-size:1rem;font-weight:900;width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.summary-symbol.blue{background:#1c3c60;color:#76b8ff}.summary-symbol.orange{background:#49301c;color:#ffb36a}.summary-symbol.green{background:#1b4035;color:#6de0b0}.summary-symbol.violet{background:#33284e;color:#c6a4ff}
.available-total{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-top:1px solid rgba(150,180,220,.14);border-bottom:1px solid rgba(150,180,220,.14)}
.available-total div{display:flex;flex-direction:column;gap:4px}.available-total div small{font-weight:800;font-size:.94rem}.available-total div span{font-size:.75rem;color:var(--muted-color)}
.available-total>strong{font-size:1.85rem;letter-spacing:-.05em;color:#8fc1ff}.available-total>strong small{font-size:.8rem;letter-spacing:0;color:var(--muted-color)}
.estimate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.estimate-item{display:flex;gap:9px;align-items:flex-start;padding:12px 10px;border-radius:14px;background:#172537;border:1px solid #263b52;min-width:0}
.estimate-item>span{font-size:1.15rem}.estimate-item div{display:flex;flex-direction:column;gap:5px;min-width:0}.estimate-item small{font-size:.69rem;color:#a9b8c9;line-height:1.35}.estimate-item strong{font-size:.94rem;overflow-wrap:anywhere}.estimate-item em{font-size:.68rem;font-style:normal;color:#a9b8c9;font-weight:500}
.home-house-card{padding:17px!important}.house-icon{background:#1a3d3b;color:#7de0cf}.home-counter{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-counter button{width:46px!important;height:46px;min-width:46px;border-radius:15px!important;font-size:1.45rem;padding:0!important}
.counter-value{flex:1;text-align:center;display:flex;flex-direction:column;gap:1px}.counter-value input{font-size:1.7rem!important;font-weight:800;text-align:center;background:transparent!important;border:0!important;padding:0!important}.counter-value small{font-size:.7rem;color:var(--muted-color)}
.stock-alert{margin-top:15px;padding:13px;border:1px solid #795421;border-radius:14px;background:#2c2419}.stock-alert p{display:block!important;color:#c6b8a3;font-size:.82rem}.stock-alert input{margin:8px 0}.stock-confirmed{display:block!important;font-size:.8rem;color:var(--muted-color)}
.stock-confirmed button{width:auto;padding:6px 10px}
.data-stock-card,.data-price-card,.pickups-data-card{padding:18px!important}
.stock-icon{background:#1d3957}.money-icon{background:#42321e;color:#ffd08a}.pickup-list-icon{background:#26364c}
.input-action-row{position:relative;display:flex;align-items:center;gap:9px;margin-top:16px}
.input-action-row input{flex:1;min-width:0;font-size:1.15rem!important;font-weight:750}
.input-suffix{color:var(--muted-color);font-size:.76rem;white-space:nowrap}
.save-round{width:42px!important;height:42px;min-width:42px;border-radius:14px!important;padding:0!important;font-size:1.15rem}
.section-heading-inline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 3px 12px}
.section-heading-inline h3{font-size:1.05rem;margin:0}.section-heading-inline small{font-size:.7rem;color:var(--muted-color);text-align:right}
.cost-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cost-summary-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px;border-radius:19px;border:1px solid rgba(150,180,220,.14);background:linear-gradient(145deg,#1a2b40,#151e2c);min-width:0}
.cost-card-icon{width:34px;height:34px;border-radius:11px;background:#263d58;display:grid;place-items:center}
.cost-summary-card small{font-size:.75rem;color:#b4c2d2;line-height:1.35}.cost-summary-card strong{font-size:1.3rem;letter-spacing:-.04em;overflow-wrap:anywhere}.cost-summary-card>span:last-child{font-size:.7rem;color:var(--muted-color)}
.daily-cost{background:linear-gradient(145deg,#263025,#18251f)}.daily-cost .cost-card-icon{background:#30452e}
.helper-note{font-size:.76rem;line-height:1.5;color:var(--muted-color);margin:12px 3px 20px}
.secondary-action{width:100%;border:1px solid #344b65!important;background:#1a2b40!important;color:#d9e8fa!important;border-radius:14px!important;padding:13px 15px!important;font-weight:750}
.export-wrap{margin:14px 0 5px}
#pickupPanel .section-title{margin-bottom:16px}
#pickupPanel .pickup-fields label{display:flex;flex-direction:column;gap:7px;font-size:.77rem;color:var(--muted-color);margin-bottom:10px}
#pickupPanel .pickup-fields input{width:100%}
@media(max-width:380px){.home-hero{padding:14px!important}.summary-grid,.estimate-grid,.cost-summary-grid{gap:8px}.summary-item{padding:11px 9px}.estimate-item{padding:10px 8px}.cost-summary-card{padding:13px 11px}.cost-summary-card strong{font-size:1.12rem}.screen-heading h2{font-size:1.4rem}}


/* Navegación inferior: iconografía de línea coherente y estados táctiles */
nav.app-bottom-nav{height:76px;left:0;right:0;top:auto;bottom:0;padding:8px 10px max(8px,env(safe-area-inset-bottom));gap:5px;align-items:center;justify-content:space-around;background:rgba(12,21,34,.94);border-top:1px solid rgba(131,164,205,.18);border-bottom:0;box-shadow:0 -12px 35px rgba(0,0,0,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
nav.app-bottom-nav button{height:56px;min-width:0;flex:1;border-radius:17px;color:#899bb1;gap:4px;font-size:.72rem;font-weight:650;padding:6px 2px;transition:background .18s ease,color .18s ease,transform .18s ease}
nav.app-bottom-nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
nav.app-bottom-nav button span{font-size:.68rem;letter-spacing:.01em}
nav.app-bottom-nav button.active{color:#f5f9ff;background:linear-gradient(135deg,#244a70,#1b3450);box-shadow:inset 0 0 0 1px rgba(122,178,238,.2)}
nav.app-bottom-nav button.active svg{color:#ffad54;transform:translateY(-1px)}
nav.app-bottom-nav button:active{transform:scale(.96)}
#content{padding-bottom:104px!important}
/* Fondo atmosférico: brillo azul frío y resplandor cálido inspirado en una estufa */
body:not(.light-mode){background-color:#0c1522;background-image:radial-gradient(ellipse at 82% 6%,rgba(46,100,153,.20) 0%,rgba(24,47,74,.08) 24%,transparent 48%),radial-gradient(ellipse at 8% 35%,rgba(218,111,38,.09) 0%,transparent 32%),linear-gradient(180deg,#0e1928 0%,#101a29 48%,#0b1420 100%);background-attachment:fixed}
body:not(.light-mode)::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;background-image:radial-gradient(circle at 88% 18%,rgba(255,174,84,.15) 0 2px,transparent 3px),radial-gradient(circle at 83% 22%,rgba(255,174,84,.10) 0 1px,transparent 2px),radial-gradient(circle at 91% 25%,rgba(115,172,226,.12) 0 2px,transparent 3px);background-size:130px 150px,90px 110px,170px 190px}
body:not(.light-mode) #content>.screen-heading .heading-icon{box-shadow:0 8px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05)}
.expense-row-total{min-width:95px}
.edit-light-btn{display:block;margin:7px 0 0 auto;padding:6px 8px!important;border-radius:9px!important;border:1px solid #375a7c!important;background:#1a3047!important;color:#a9d2ff!important;font-size:.69rem!important;white-space:nowrap}
@media(min-width:700px){nav.app-bottom-nav{left:50%;right:auto;width:min(560px,100%);transform:translateX(-50%);border:1px solid rgba(131,164,205,.18);border-bottom:0;border-radius:22px 22px 0 0}}
body.light-mode nav.app-bottom-nav{background:rgba(248,250,253,.96);border-color:#d9e2ed;box-shadow:0 -10px 28px rgba(24,42,65,.10)}
body.light-mode nav.app-bottom-nav button{color:#66758a}

/* Calendario v5: cuadrícula mensual de tarjetas independientes */
.calendar-card{
  padding:15px 12px 13px!important;
  overflow:hidden;
  border:1px solid rgba(130,164,204,.17)!important;
  background:linear-gradient(160deg,rgba(25,42,62,.97),rgba(15,27,42,.98))!important;
  box-shadow:0 16px 38px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035);
}
#calendar{
  --fc-border-color:transparent;

}
#calendar .fc-toolbar{
  display:grid;

  gap:7px;

#calendar .fc-scrollgrid,#calendar .fc-scrollgrid table{border:0!important}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAM4pMCb1rPcZ_q-ncOMp4C8p9VTrt-qLc", authDomain: "sacos-pellet.firebaseapp.com", projectId: "sacos-pellet", storageBucket: "sacos-pellet.firebasestorage.app", messagingSenderId: "215063841201", appId: "1:215063841201:web:c36979a5ac466d3e061590" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const datosRef = doc(db,"datos","principal");
const content = document.getElementById("content");
const seasonSelect = document.getElementById("seasonSelect");

let data = {};
let currentSeason = "";

// ----------------- AUX -----------------
function getCurrentSeasonData(){ if(!currentSeason || !data[currentSeason]) currentSeason=Object.keys(data)[0]; return data[currentSeason]; }

// ----------------- RENDER DATOS -----------------


function calcularConsumo(p) {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);

  const recogidas = (p.pickups || [])
    .filter(r => {
      const fecha = new Date(r.fecha + "T00:00:00");
      return !isNaN(fecha.getTime()) && fecha <= hoy;
    })
    .sort((a, b) => a.fecha.localeCompare(b.fecha));

  const sacosIniciales = Math.max(0, Number(p.sacos) || 0);
  const sacosCasa = Math.max(0, Number(p.sacosCasa) || 0);

  const totalRecogido = recogidas.reduce(
    (total, r) => total + Math.max(0, Number(r.sacos) || 0),
    0
  );

  const consumidos = Math.max(0, totalRecogido - sacosCasa);
  const restantesAlmacen = Math.max(0, sacosIniciales - totalRecogido);
  const totalDisponible = restantesAlmacen + sacosCasa;

  let mediaDiaria = 0;
  let diasEstimados = 0;
  let diasPeriodo = 0;
  let fechaFinPeriodo = null;

  if (recogidas.length > 0) {
    const primeraFecha = new Date(
      recogidas[0].fecha + "T00:00:00"
    );

    // Si quedan sacos, el periodo llega hasta hoy.
    fechaFinPeriodo = new Date(hoy);

    // Si el usuario confirmó el día exacto de agotamiento, usarlo
    // como final del periodo para que la media no siga contando días posteriores.
    if (p.fechaStockCero) {
      const fechaConfirmada = new Date(p.fechaStockCero + "T00:00:00");
      if (!isNaN(fechaConfirmada.getTime())) fechaFinPeriodo = fechaConfirmada;
    } else if (totalDisponible <= 0 && sacosIniciales > 0) {
      // Antes de confirmar, usar una fecha provisional basada en las recogidas.
      let acumulado = 0;
      for (const recogida of recogidas) {
        acumulado += Math.max(0, Number(recogida.sacos) || 0);
        if (acumulado >= sacosIniciales) {
          fechaFinPeriodo = new Date(recogida.fecha + "T00:00:00");
          break;
        }
      }
    }

    // Días naturales del periodo, contando ambos extremos.
    diasPeriodo = Math.max(
      1,
      Math.floor((fechaFinPeriodo - primeraFecha) / 86400000) + 1
    );

    mediaDiaria = consumidos / diasPeriodo;

    // Si no quedan sacos, no continuar estimando.
    diasEstimados =
      totalDisponible > 0 && mediaDiaria > 0
        ? Math.ceil(totalDisponible / mediaDiaria)
        : 0;
  }

  return {
    totalRecogido,
    consumidos,
    restantesAlmacen,
    totalDisponible,
    mediaDiaria,
    diasEstimados,
    fechaFinPeriodo,
    diasPeriodo
  };
}

function updateDatos() {
  const p = getCurrentSeasonData();
  if (!p) return;

  const {
    consumidos,
    restantesAlmacen,
    totalDisponible,
    mediaDiaria,
    diasEstimados
  } = calcularConsumo(p);

  const resumenDiv = document.getElementById("resumenSacos");

  if (resumenDiv) {
    resumenDiv.innerHTML = `
      <p>🟦 Sacos iniciales en almacén:
        <strong>${p.sacos}</strong></p>
      <p>🔴 Consumidos:
        <strong>${consumidos}</strong></p>
      <p>🟢 En almacén:
        <strong>${restantesAlmacen}</strong></p>
      <p>🏠 En casa:
        <strong>${p.sacosCasa || 0}</strong></p>
      <p>📦 Total disponible:
        <strong>${totalDisponible}</strong></p>
      <p>📅 Duración estimada:
        <strong>${totalDisponible > 0 && mediaDiaria > 0
          ? diasEstimados + " días"
          : "Sin estimación"}</strong></p>
      <p>⚡ Consumo medio diario:
        <strong>${mediaDiaria.toFixed(2)} sacos/día</strong></p>
      ${totalDisponible <= 0 && Number(p.sacos) > 0 && (p.pickups || []).length && !p.fechaStockCero ? `
        <div style="margin-top:14px;padding:12px;border:1px solid #f59e0b;border-radius:10px;background:#292015;">
          <strong>⚠️ ¿Qué día te quedaste exactamente sin sacos?</strong>
          <p style="margin:8px 0;">Confirma la fecha para detener el cálculo ese día y ajustar la media de consumo.</p>
          <input id="fechaStockCero" type="date" max="${new Date().toLocaleDateString('en-CA')}" value="${(p.pickups || []).map(r=>r.fecha).filter(Boolean).sort().slice(-1)[0] || new Date().toLocaleDateString('en-CA')}" style="width:100%;box-sizing:border-box;">
          <button class="primary" onclick="confirmarFechaStockCero()">Confirmar fecha de agotamiento</button>
        </div>` : p.fechaStockCero ? `
        <p>📍 Stock agotado confirmado el: <strong>${p.fechaStockCero}</strong>
        <button onclick="cambiarFechaStockCero()" style="width:auto;padding:5px 9px;margin-left:8px;">Cambiar</button></p>` : ''}
    `;
  }

  const pickupsDiv = document.getElementById("listPickups");

  if (pickupsDiv) {
    const ordenadas = [...(p.pickups || [])]
      .sort((a, b) => a.fecha.localeCompare(b.fecha));

    pickupsDiv.innerHTML = ordenadas.map((r, i) =>
      `${r.fecha} → ${r.sacos} sacos
      <button onclick="deletePickupByDate('${r.fecha}',${r.sacos})">❌</button><br>`
    ).join("") || "Sin recogidas";
  }
}

function renderInicio(){
  const p=getCurrentSeasonData();
  if(!p) return;
  const c=calcularConsumo(p);
  content.innerHTML=`
    <div class="screen-heading">
      <div><span class="eyebrow">TU TEMPORADA</span><h2>Resumen general</h2><p>Así van tus sacos de pellet</p></div>
      <div class="heading-icon">🔥</div>
    </div>
    <div class="card home-hero" id="homeSummary">
      <div class="hero-title"><span class="hero-icon">📦</span><div><h3>Control de existencias</h3><small>Estado actual del almacén</small></div></div>
      <div class="summary-grid">
        <div class="summary-item"><span class="summary-symbol blue">▣</span><small>Sacos iniciales</small><strong>${Number(p.sacos)||0}</strong></div>
        <div class="summary-item"><span class="summary-symbol orange">↘</span><small>Consumidos</small><strong>${c.consumidos}</strong></div>
        <div class="summary-item"><span class="summary-symbol green">▤</span><small>En almacén</small><strong>${c.restantesAlmacen}</strong></div>
        <div class="summary-item"><span class="summary-symbol violet">⌂</span><small>En casa</small><strong>${Number(p.sacosCasa)||0}</strong></div>
      </div>
      <div class="available-total"><div><small>Total disponible</small><span>Entre almacén y casa</span></div><strong>${c.totalDisponible}<small> sacos</small></strong></div>
      <div class="estimate-grid">
        <div class="estimate-item"><span>⚡</span><div><small>Consumo medio diario</small><strong>${c.mediaDiaria.toFixed(2)} <em>sacos/día</em></strong></div></div>
        <div class="estimate-item"><span>📅</span><div><small>Duración estimada</small><strong>${c.totalDisponible>0 && c.mediaDiaria>0 ? c.diasEstimados+" días" : "Sin estimación"}</strong></div></div>
      </div>
      ${c.totalDisponible<=0 && Number(p.sacos)>0 && (p.pickups||[]).length && !p.fechaStockCero ? `
        <div class="stock-alert"><strong>⚠️ ¿Qué día te quedaste exactamente sin sacos?</strong><p>Confirma la fecha para ajustar la media de consumo.</p>
          <input id="fechaStockCero" type="date" max="${new Date().toLocaleDateString('en-CA')}" value="${(p.pickups||[]).map(r=>r.fecha).filter(Boolean).sort().slice(-1)[0]||new Date().toLocaleDateString('en-CA')}">
          <button class="primary" onclick="confirmarFechaStockCero()">Confirmar fecha de agotamiento</button>
        </div>` : p.fechaStockCero ? `<p class="stock-confirmed">📍 Stock agotado confirmado el: <strong>${p.fechaStockCero}</strong> <button onclick="cambiarFechaStockCero()">Cambiar</button></p>` : ''}
    </div>
    <div class="card home-house-card">
      <div class="section-title"><div class="section-icon house-icon">⌂</div><div><h3>Sacos en casa</h3><p>Actualiza los sacos que tienes a mano</p></div></div>
      <div class="card-casa home-counter" style="max-width:100%">
        <button aria-label="Restar un saco" onclick="updateCasa(-1)">−</button>
        <div class="counter-value"><input id="sacosCasa" type="number" value="${p.sacosCasa||0}" readonly><small>sacos disponibles</small></div>
        <button class="primary" aria-label="Añadir un saco" onclick="updateCasa(1)">＋</button>
      </div>
    </div>

function parseSpanishNumber(text){
  const t=text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g," ").replace(/[.,]/g," ").trim();
  const beforeSacos=(t.split(/\bsacos?\b/)[0]||t);
  const digit=(beforeSacos.match(/\b\d{1,3}\b/)||[])[0];
  if(digit) return Number(digit);
  const units={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintiun:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50, sesenta:60,setenta:70,ochenta:80,noventa:90};
  const words=beforeSacos.split(/\s+/);
  let total=0, found=false;
  for(let i=0;i<words.length;i++){
    const w=words[i];
    if(units[w]!==undefined){total+=units[w];found=true;}
    else if(w==="y" || w==="sacos" || w==="saco" || w==="he" || w==="recogido" || w==="recogida" || w==="apunta" || w==="apuntame" || w==="anota" || w==="anotame" || w==="el" || w==="de" || w==="del" || w==="dia" || w==="hoy" || w==="ayer" || w==="anteayer" || w==="octubre" || w==="enero" || w==="febrero" || w==="marzo" || w==="abril" || w==="mayo" || w==="junio" || w==="julio" || w==="agosto" || w==="septiembre" || w==="noviembre" || w==="diciembre" || /^\d{4}$/.test(w)) continue;
  }
  return found?total:null;
}
function parsePickupDate(text){
  const t=text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g," ");
  const now=new Date();
  const iso=(t.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/)||[]);
  if(iso.length){return `${iso[1]}-${String(iso[2]).padStart(2,"0")}-${String(iso[3]).padStart(2,"0")}`;}
  const slash=t.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2})\b/);
  if(slash) return `${slash[3]}-${String(slash[2]).padStart(2,"0")}-${String(slash[1]).padStart(2,"0")}`;
  let d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(/\banteayer\b/.test(t)) d.setDate(d.getDate()-2);
  else if(/\bayer\b/.test(t)) d.setDate(d.getDate()-1);
  else if(/\bhoy\b/.test(t)) {}
  else {
    const months={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11};
    const monthMatch=t.match(/\b(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/);
    if(monthMatch){
      const before=t.slice(0,monthMatch.index);
      const dayMatches=[...before.matchAll(/\b(\d{1,2})\b/g)];
      const dayMatch=dayMatches.length?dayMatches[dayMatches.length-1]:null;
      const after=t.slice(monthMatch.index+monthMatch[0].length);
      const yearMatch=after.match(/\b(20\d{2})\b/) || t.match(/\b(20\d{2})\b/);
      const day=dayMatch?Number(dayMatch[1]):null;
      if(day && day>=1 && day<=31){
        const year=yearMatch?Number(yearMatch[1]):now.getFullYear();
        d=new Date(year,months[monthMatch[0]],day);
        if(d.getMonth()!==months[monthMatch[0]]) return null;
      } else return null;
    } else {
      const dayOnly=t.match(/\b(?:dia\s*)?(\d{1,2})\b/);
      if(dayOnly && /\b(dia|el)\b/.test(t)){
        d=new Date(now.getFullYear(),now.getMonth(),Number(dayOnly[1]));
      } else return null;
    }
  }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function showVoicePickupConfirmation(quantity,dateLabel){
  return new Promise(resolve=>{
    document.querySelector(".voice-confirm-overlay")?.remove();

}

function startVoicePickup(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("Tu navegador no ofrece reconocimiento de voz. Abre MiPellets con Google Chrome actualizado y comprueba que tenga permiso para usar el micrófono.");
    return;
  }
  const recognition=new SpeechRecognition();
  recognition.lang="es-ES";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  const voiceButton=document.querySelector(".fab-voice");
  if(voiceButton){voiceButton.disabled=true;voiceButton.textContent="…";}
  recognition.onresult=async(event)=>{
    const transcript=event.results?.[0]?.[0]?.transcript||"";
    const quantity=parseSpanishNumber(transcript);
    const date=parsePickupDate(transcript);
    if(!quantity || quantity<1 || quantity>999){
      alert(`He oído: «${transcript}».\nNo he podido identificar correctamente la cantidad de sacos. Prueba diciendo, por ejemplo: «He recogido 10 sacos hoy».`);
      return;
    }
    if(!date){
      alert(`He oído: «${transcript}».\nNo he podido identificar la fecha. Prueba diciendo: «He recogido 10 sacos el 30 de octubre de 2026».`);
      return;
    }
    const [year,month,day]=date.split("-");
    const dateLabel=`${day}/${month}/${year}`;
    const accepted=await showVoicePickupConfirmation(quantity,dateLabel);
    if(accepted){
      const fechaInput=document.getElementById("fecha");
      const cantidadInput=document.getElementById("cantidad");
      if(fechaInput && cantidadInput){
        fechaInput.value=date;
        cantidadInput.value=quantity;
        await addPickup();
      } else {
        alert("No se ha podido abrir el registro. Vuelve a Inicio e inténtalo de nuevo.");
      }
    }
  };
  recognition.onerror=(event)=>{
    if(event.error==="not-allowed" || event.error==="service-not-allowed")
      alert("No hay permiso para usar el micrófono. Activa el permiso de micrófono para Chrome en los ajustes de Android.");
    else if(event.error!=="no-speech" && event.error!=="aborted")
      alert("No se ha podido reconocer la voz. Comprueba la conexión y vuelve a intentarlo.");
  };
  recognition.onend=()=>{
    if(voiceButton){voiceButton.disabled=false;voiceButton.textContent="🎙️";}
  };
  try{recognition.start();}
  catch(error){
    if(voiceButton){voiceButton.disabled=false;voiceButton.textContent="🎙️";}
    alert("No se ha podido iniciar el micrófono. Espera un momento y vuelve a intentarlo.");
  }
}
window.startVoicePickup=startVoicePickup;

function showCalendario(btn){
  const p=getCurrentSeasonData(); if(!p) return;
  setActive(btn);
  content.innerHTML=`
    <div class="screen-heading">
      <div><span class="eyebrow">PLANIFICACIÓN</span><h2>Calendario</h2><p>Consumo, recogidas y previsión</p></div>
      <div class="heading-icon">🗓️</div>
    </div>
    <div class="card calendar-card"><div id="calendar"></div></div>`;
  const calEl=document.getElementById("calendar");

  const hoy=new Date();
  hoy.setHours(0,0,0,0);
  const fechaClave = fecha => {
    const d = new Date(fecha);
    d.setHours(0,0,0,0);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };

  const pickupsOrdenadas=[...(p.pickups||[])]
    .filter(r => r.fecha && !isNaN(new Date(r.fecha+"T00:00:00").getTime()))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const calculo=calcularConsumo(p);
  const primeraRecogida=pickupsOrdenadas.find(r => new Date(r.fecha+"T00:00:00") <= hoy);
  const primeraFecha=primeraRecogida ? new Date(primeraRecogida.fecha+"T00:00:00") : null;

  // Si se agotó el stock, encontrar la fecha en la que se agotó.
  // No se colorea ese día ni ninguno posterior.
  let fechaAgotamiento=null;
  if (p.fechaStockCero) {
    fechaAgotamiento = new Date(p.fechaStockCero + "T00:00:00");
  } else if(calculo.totalDisponible<=0 && Number(p.sacos)>0){
    let acumulado=0;
    for(const r of pickupsOrdenadas){
      const fecha=new Date(r.fecha+"T00:00:00");
      if(fecha>hoy) continue;
      acumulado += Math.max(0, Number(r.sacos)||0);
      if(acumulado >= Number(p.sacos)){
        fechaAgotamiento=fecha;
        break;
      }
    }
  }

  // Calcular el color de cada día al crear la casilla. Así FullCalendar
  // conserva los círculos al avanzar y retroceder entre meses.
  function clasesCirculo(fechaEntrada){
    const fecha = new Date(fechaEntrada);
    fecha.setHours(0,0,0,0);

    // No marcar el día de agotamiento ni ninguno posterior.
    if(fechaAgotamiento && fecha >= fechaAgotamiento) return [];

    if(fechaClave(fecha) === fechaClave(hoy) && calculo.totalDisponible > 0){
      return ['day-circle','day-circle-red'];
    }

    if(primeraFecha && fecha >= primeraFecha && fecha < hoy){
      return ['day-circle','day-circle-brown'];
    }

    if(calculo.totalDisponible > 0 && calculo.diasEstimados > 0 && fecha > hoy){
      const fechaFin = new Date(hoy);
      fechaFin.setDate(fechaFin.getDate() + calculo.diasEstimados);
      if(fecha <= fechaFin) return ['day-circle','day-circle-green'];
    }

    return [];
  }

  const calendar=new FullCalendar.Calendar(calEl,{
    locale:"es",
    initialView:"dayGridMonth",
    firstDay:1,
    height:"auto",
    headerToolbar:{
      left:"prev,next",
      center:"title",
      right:"today"
    },
    buttonText:{
      today:"Hoy"
    },
    dayCellClassNames:function(arg){
      const clases = (arg.date.getDay()===0 || arg.date.getDay()===6)
        ? ['weekend-day'] : ['weekday'];
      return clases.concat(clasesCirculo(arg.date));
    }
  });

  // Mostrar cada recogida en el calendario con su cantidad de sacos.
  // Estas marcas azules son independientes de los círculos de los días.
  pickupsOrdenadas.forEach(recogida => {
    const cantidad = Math.max(0, Number(recogida.sacos) || 0);
    calendar.addEvent({
      start: recogida.fecha,
      allDay: true,
      title: `+${cantidad} sacos`,
      classNames: ["pickup-event"],
      display: "block"
    });
  });

  calendar.render();
}

    const partes = r.fecha.split("-").map(Number);
    if(partes.length !== 3 || !partes[0] || !partes[1]) return;
    const clave = `${partes[0]}-${String(partes[1]).padStart(2,"0")}`;
    if(!porMes[clave]) porMes[clave] = 0;
    porMes[clave] += Math.max(0, Number(r.sacos)||0);
  });

  const claves = Object.keys(porMes).sort();
  const nombresMes = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const labels = claves.map(clave=>{
    const [anio, mes] = clave.split("-").map(Number);
    return `${nombresMes[mes-1]} ${anio}`;
  });
  const sacos = claves.map(clave=>porMes[clave]);
  const precio = Math.max(0, Number(p.precioSaco)||0);
  const euros = sacos.map(cantidad=>cantidad*precio);
  // Coste diario medio: coste estimado del mes dividido entre todos los días naturales de ese mes.
  const costesDiarios = claves.map((clave,i)=>{
    const [anio,mes] = clave.split("-").map(Number);
    const diasDelMes = new Date(anio, mes, 0).getDate();
    return diasDelMes ? euros[i] / diasDelMes : 0;
  });
  const valores = tipo === "euros" ? euros : tipo === "diario" ? costesDiarios : sacos;
  const esCoste = tipo === "euros" || tipo === "diario";
  const colores = ["#60a5fa","#34d399","#fbbf24","#f87171","#c084fc","#fb923c","#2dd4bf","#f472b6","#a3e635","#818cf8","#e879f9","#facc15"];
  document.getElementById("descripcionGrafica").textContent = tipo === "euros"
    ? `Coste estimado total de las recogidas de cada mes: sacos recogidos × ${precio.toLocaleString("es-ES",{style:"currency",currency:"EUR"})} por saco.`
    : tipo === "diario"
      ? `Media diaria estimada: coste mensual dividido entre los días naturales de cada mes (28–31 días).`
      : "Número total de sacos registrados en las recogidas de cada mes.";

  if(graficaInstancia){ graficaInstancia.destroy(); graficaInstancia = null; }
  graficaInstancia = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{ labels, datasets:[{
      label: tipo === "euros" ? "Coste mensual estimado (€)" : tipo === "diario" ? "Coste diario medio (€ / día)" : "Sacos recogidos",
      data:valores,
      backgroundColor:labels.map((_,i)=>colores[i % colores.length]),
      borderColor:labels.map((_,i)=>colores[i % colores.length]),
      borderWidth:1,
      borderRadius:5
    }] },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:"#fff",font:{size:14}}},
        tooltip:{callbacks:{label:context=> esCoste
          ? ` ${context.parsed.y.toLocaleString("es-ES",{style:"currency",currency:"EUR"})}${tipo === "diario" ? " / día" : ""}`
          : ` ${context.parsed.y} sacos`}}
      },
      scales:{
        x:{ticks:{color:"#fff",font:{size:12}},grid:{color:"#333"}},
        y:{beginAtZero:true,ticks:{color:"#fff",callback:value=>esCoste ? `${value} €` : value},grid:{color:"#333"}}
      }
    }
  });
}

  tipoGraficaActual = tipo;
  showGrafica(document.querySelector('nav button.active'), tipo);
}

let touchStartX = 0, touchStartY = 0;
const navButtons = () => [...document.querySelectorAll('nav button')];
content.addEventListener('touchstart', e => {
  if (!e.touches || e.touches.length !== 1) return;
  const target = e.target;
  if (target.closest('input,textarea,select,button,a,#calendar,.fc,canvas')) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
content.addEventListener('touchend', e => {
  if (!touchStartX || !e.changedTouches?.length) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = 0; touchStartY = 0;
  if (Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy) * 1.05) return;
  const buttons = navButtons();
  const activeIndex = Math.max(0, buttons.findIndex(b => b.classList.contains('active')));
  const nextIndex = Math.min(buttons.length - 1, Math.max(0, activeIndex + (dx < 0 ? 1 : -1)));
  if (nextIndex === activeIndex) return;
  content.classList.add('swipe-changing');
  buttons[nextIndex].click();
  requestAnimationFrame(() => {
    content.classList.remove('swipe-changing');
    content.classList.add('swipe-enter');
    requestAnimationFrame(() => content.classList.remove('swipe-enter'));
  });
}, {passive:true});

// ----------------- GASTOS ANUALES -----------------
function datosGastosTemporada() {
  const p = getCurrentSeasonData();
  if (!p) return null;
  if (!p.gastosLuz) p.gastosLuz = {};
  return p;
}
function gastosLuzCompartidos() {
  const salida = {};
  // Prioriza los datos de la temporada seleccionada y recupera también
  // facturas guardadas en temporadas anteriores para no perderlas.
  const nombres = Object.keys(data || {});
  const orden = [currentSeason, ...nombres.filter(nombre => nombre !== currentSeason)];
  orden.forEach(nombre => {
    const temporada = data[nombre];
    if (!temporada || typeof temporada !== 'object' || Array.isArray(temporada)) return;
    Object.entries(temporada.gastosLuz || {}).forEach(([mes, dato]) => {
      if (salida[mes] === undefined && dato && dato.importe !== undefined) salida[mes] = dato;
    });
  });
  return salida;
}
function euros(n) { return (Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}); }

  cargarGastoLuz();

}
function calcularGastosMensuales(anio) {
  const salida = {};
  Object.values(data || {}).forEach(p => {
    if (!p || typeof p !== 'object' || Array.isArray(p)) return;
    const precio = Math.max(0, Number(p.precioSaco) || 0);
    (p.pickups || []).forEach(r => {
      if (!r.fecha || !r.fecha.startsWith(String(anio)+'-')) return;
      const mes = r.fecha.slice(0,7);
      salida[mes] ||= {pellets:0,luz:0};
      salida[mes].pellets += Math.max(0,Number(r.sacos)||0) * precio;
    });
  });
  Object.entries(gastosLuzCompartidos()).forEach(([mes, dato]) => {
    if (!mes.startsWith(String(anio)+'-')) return;
    salida[mes] ||= {pellets:0,luz:0};
    salida[mes].luz = Math.max(0,Number(dato.importe)||0);
  });
  return salida;
}
function pintarGraficaGastos() {
  const p = getCurrentSeasonData();
  const anio = Number(document.getElementById('gastosAnio')?.value || new Date().getFullYear());
  if (!p || !document.getElementById('gastosPie')) return;
  const gastos = calcularGastosMensuales(anio);
  const nombresMes = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const claves = Array.from({length:12},(_,i)=>`${anio}-${String(i+1).padStart(2,'0')}`);
  const pellets = claves.map(clave => gastos[clave]?.pellets || 0);
  const luz = claves.map(clave => gastos[clave]?.luz || 0);
  const totalPellets = pellets.reduce((a,v)=>a+v,0);
  const totalLuz = luz.reduce((a,v)=>a+v,0);
  document.getElementById('totalPellets').textContent = euros(totalPellets);
  document.getElementById('totalLuz').textContent = euros(totalLuz);
  document.getElementById('totalGastos').textContent = euros(totalPellets+totalLuz);
  if (window.gastosPieInstancia) { window.gastosPieInstancia.destroy(); window.gastosPieInstancia=null; }
  window.gastosPieInstancia = new Chart(document.getElementById('gastosPie'), {
    type:'bar',
    data:{
      labels:nombresMes,
      datasets:[
        {label:'Pellets',data:pellets,backgroundColor:'#f59e0b',borderRadius:6,borderSkipped:false,maxBarThickness:22},
        {label:'Luz',data:luz,backgroundColor:'#4f9cf9',borderRadius:6,borderSkipped:false,maxBarThickness:22}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      scales:{
        x:{grid:{display:false},ticks:{color:document.body.classList.contains('light-mode')?'#526174':'#aebed0',maxRotation:0,autoSkip:false},border:{display:false}},
        y:{beginAtZero:true,grid:{color:document.body.classList.contains('light-mode')?'rgba(31,41,55,.10)':'rgba(180,200,225,.10)'},ticks:{color:document.body.classList.contains('light-mode')?'#526174':'#aebed0',callback:v=>`${v} €`},border:{display:false}}
      },
      plugins:{
        legend:{position:'bottom',labels:{color:document.body.classList.contains('light-mode')?'#1f2937':'#f0f0f0',padding:16,usePointStyle:true,pointStyle:'roundedRect'}},
        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${euros(c.parsed.y)}`}}
      }
    }
  });
  const detalle = document.getElementById('detalleGastosMes');
  detalle.innerHTML = claves.map(clave=>{
    const mesNum=Number(clave.slice(5,7))-1;
    const dato=gastos[clave]||{pellets:0,luz:0};
    const total=dato.pellets+dato.luz;
    return `<div class="expense-row"><div><strong>${nombresMes[mesNum][0].toUpperCase()+nombresMes[mesNum].slice(1)}</strong><small>🔥 Pellets: ${euros(dato.pellets)} · 💡 Luz: ${euros(dato.luz)}</small></div><div class="expense-row-total" style="text-align:right"><strong>${euros(total)}</strong><small>Total del mes</small>${gastosLuzCompartidos()[clave] ? `<button class="edit-light-btn" onclick="editarGastoLuz('${clave}')">✎ Corregir luz</button>` : (dato.pellets>0 ? `<button class="edit-light-btn" onclick="editarGastoLuz('${clave}')">＋ Añadir luz</button>` : '')}</div></div>`;
  }).join('');
}
function cargarGastoLuz() {
  const p = datosGastosTemporada();
  const mes = document.getElementById('mesFactura')?.value;
  const input = document.getElementById('importeLuz');
  const hint = document.getElementById('luzEditHint');
  if (!p || !mes || !input) return;
  const guardado = gastosLuzCompartidos()[mes];
  input.value = guardado && guardado.importe !== undefined ? guardado.importe : '';
  if (hint) hint.textContent = guardado
    ? `Importe guardado para ${mes}: ${euros(guardado.importe)}. Puedes corregirlo y volver a guardar.`
    : 'Todavía no hay un importe guardado para este mes.';
}
function editarGastoLuz(mes) {
  openGastos();
  const selector = document.getElementById('mesFactura');
  if (selector) {
    selector.value = mes;
    cargarGastoLuz();
    document.getElementById('importeLuz')?.focus();
    document.getElementById('importeLuz')?.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
async function guardarGastoLuz() {
  const p = datosGastosTemporada();
  const mes = document.getElementById('mesFactura')?.value;
  const importeRaw = document.getElementById('importeLuz')?.value;
  const importe = Number(importeRaw);
  if (!p || !mes || importeRaw === '' || !Number.isFinite(importe) || importe < 0) {
    alert('Selecciona el mes e introduce un importe de luz válido.'); return;
  }
  const datoAnterior = gastosLuzCompartidos()[mes] || {};
  const dato = { ...datoAnterior, importe };
  try {
    // Mantiene la factura compartida sincronizada en las temporadas existentes.
    Object.values(data).forEach(temporada => {
      if (temporada && typeof temporada === 'object' && !Array.isArray(temporada)) {
        if (!temporada.gastosLuz) temporada.gastosLuz = {};
        temporada.gastosLuz[mes] = dato;
      }
    });
    await setDoc(datosRef,data);
    alert('Gasto de luz guardado.');
    openGastos();
  } catch(e) {
    console.error('Error guardando gasto de luz:', e);
    alert('No se pudo guardar el gasto de luz. ' + (e?.message || 'Error desconocido'));
  }
}
window.openGastos=openGastos;
window.guardarGastoLuz=guardarGastoLuz;
window.editarGastoLuz=editarGastoLuz;
