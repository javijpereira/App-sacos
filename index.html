<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · Control de Sacos</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="theme-color" content="#121c2b">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e5e7eb;
}

/* Contenedor principal */
.auth-container {
  width: 100%;
  padding: 1rem;
  display: flex;
  justify-content: center;
}

/* Tarjeta */
.auth-card {
  width: 100%;
  max-width: 400px;
  background: #020617;
  padding: 2.5rem 2rem;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Cabecera centrada */
.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-header .logo {
   width: 112px;
   height: 112px;
   display: block;
   margin: 0 auto;
   filter: drop-shadow(0 10px 22px rgba(249, 115, 22, 0.22));
}

.logo-wrap {
   width: 124px;
   height: 124px;
   margin: 0 auto 1.15rem;
   display: grid;
   place-items: center;
   border-radius: 50%;
   background: radial-gradient(circle, rgba(249,115,22,.13), rgba(30,41,59,.12) 68%);
}

.auth-subtitle {
   margin: .55rem 0 0;
   color: #94a3b8;
   font-size: .9rem;
}

@media (max-width: 420px) {
   .auth-card {
      padding: 2rem 1.4rem;
   }

   .auth-header .logo {
      width: 104px;
      height: 104px;
   }

   .logo-wrap {
      width: 116px;
      height: 116px;
   }
}

.auth-header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #f1f5f9;
}

/* Inputs modernos */
.auth-card input {
  width: 100%;
  padding: 0.9rem 1rem;
  margin-bottom: 1rem;
  border-radius: 12px;
  border: none;
  outline: none;
  background: #1e293b;
  color: #f1f5f9;
  font-size: 1rem;
  transition: all 0.3s;
}

.auth-card input:focus {
  background: #2e3a55;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.3);
}

/* Botones modernos */
.auth-card button {
  width: 100%;
  padding: 0.9rem;
  margin-top: 0.5rem;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.3s;
}

.auth-card button#login {
  background: #2563eb;
  color: white;
}

.auth-card button#login:hover {
  background: #1e40af;
}

.auth-card button.secondary {
  background: transparent;
  color: #93c5fd;
  border: 2px solid #2563eb;
}

.auth-card button.secondary:hover {
  background: #2563eb;
  color: white;
}

/* Mensajes */
#msg {
  margin-top: 1rem;
  text-align: center;
  font-size: 0.9rem;
}


</style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Cabecera centrada -->
    <div class="auth-header">

    <div class="logo-wrap">

        <svg class="logo" viewBox="0 0 120 120">

            <defs>
                <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#fde68a"/>
                    <stop offset="55%" stop-color="#fb923c"/>
                    <stop offset="100%" stop-color="#ea580c"/>
                </linearGradient>
            </defs>

            <!-- Fondo -->
            <circle cx="60" cy="60" r="56"
                fill="#1e293b"
                stroke="#334155"
                stroke-width="2"/>

            <circle cx="60" cy="60" r="47"
                fill="#0f172a"/>

            <!-- Estufa -->
            <rect x="35" y="35" width="50" height="52"
                rx="9"
                fill="#334155"
                stroke="#94a3b8"
                stroke-width="2"/>

            <rect x="42" y="43" width="36" height="35"
                rx="5"
                fill="#0f172a"
                stroke="#64748b"
                stroke-width="2"/>

            <!-- Llama -->
            <path d="M60 20
                C63 31 53 36 54 45
                C55 50 58 53 61 56
                C62 49 68 45 69 37
                C78 46 82 55 80 65
                C78 77 70 84 60 84
                C48 84 40 77 40 65
                C40 56 46 47 54 40
                C53 49 56 53 59 56
                C63 48 60 38 60 20Z"
                fill="url(#flame)"/>

            <path d="M60 48
                C61 54 56 58 56 63
                C56 68 59 71 63 71
                C67 71 71 68 71 63
                C71 59 69 56 66 53
                C65 57 63 59 60 61
                C61 56 61 52 60 48Z"
                fill="#fff7ed"/>

            <!-- Base -->
            <path d="M29 87 H91 L86 100 H34 Z"
                fill="#334155"
                stroke="#64748b"
                stroke-width="2"/>

        </svg>

    </div>

    <h1>Control de Sacos de Pellets</h1>

    <p class="auth-subtitle">
        Tu calefacción, siempre bajo control
    </p>

</div>

      <!-- Formulario -->
      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">

      <button id="login">Entrar</button>
      <button id="register" class="secondary">Crear cuenta</button>

      <p id="msg"></p>
    </div>
  </div>
</body>


<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
  getFirestore,
  setDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAM4pMCb1rPcZ_q-ncOMp4C8p9VTrt-qLc",
  authDomain: "sacos-pellet.firebaseapp.com",
  projectId: "sacos-pellet",
  storageBucket: "sacos-pellet.firebasestorage.app",
  messagingSenderId: "215063841201",
  appId: "1:215063841201:web:c36979a5ac466d3e061590"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= ELEMENTOS ================= */
const email = document.getElementById("email");
const password = document.getElementById("password");
const msg = document.getElementById("msg");

/* ================= LOGIN ================= */
document.getElementById("login").onclick = async () => {
  msg.textContent = "";

  try{
    await signInWithEmailAndPassword(auth, email.value, password.value);
    location.href = "app.html";
  }catch(err){
    msg.textContent = "Email o contraseña incorrectos";
  }
};

/* ================= REGISTRO ================= */
document.getElementById("register").onclick = async () => {
  msg.textContent = "";

  if(!email.value || !password.value){
    msg.textContent = "Completa todos los campos";
    return;
  }

  try{
    const cred = await createUserWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );

    await setDoc(doc(db,"usuarios",cred.user.uid),{
      email: cred.user.email,
      role: "pendiente",
      creado: serverTimestamp()
    });

    msg.textContent = "Solicitud enviada. Pendiente de aprobación.";
  }catch(err){
    msg.textContent = err.message;
  }
};
</script>

</html>
